<svg viewBox="0 0 900 290" width="900" xmlns="http://www.w3.org/2000/svg">
<title>检测报告数据归档 Agent 流程图</title>
<desc>六个节点串行执行，validation 校验失败时经 reflection 生成修正指令回到 extraction 重抽，达到重试上限则强制结束</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="900" height="290" fill="#ffffff"/>

<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <text x="40" y="30" font-size="13" fill="#888780">检测报告 PDF + Excel 模板</text>

  <g>
    <rect x="40" y="60" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text x="105" y="82" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle">template</text>
    <text x="105" y="100" font-size="12" fill="#534AB7" text-anchor="middle">解析表头为列定义</text>
  </g>

  <g>
    <rect x="210" y="60" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text x="275" y="82" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle">reading</text>
    <text x="275" y="100" font-size="12" fill="#534AB7" text-anchor="middle">PDF 转带页码文本</text>
  </g>

  <g>
    <rect x="380" y="60" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text x="445" y="82" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle">meta</text>
    <text x="445" y="100" font-size="12" fill="#534AB7" text-anchor="middle">报告编号 / 样品</text>
  </g>

  <g>
    <rect x="550" y="60" width="130" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text x="615" y="82" font-size="14" font-weight="600" fill="#26215C" text-anchor="middle">extraction</text>
    <text x="615" y="100" font-size="12" fill="#534AB7" text-anchor="middle">分块抽取检测项</text>
  </g>

  <g>
    <rect x="550" y="200" width="130" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="615" y="222" font-size="14" font-weight="600" fill="#412402" text-anchor="middle">validation</text>
    <text x="615" y="240" font-size="12" fill="#854F0B" text-anchor="middle">四级校验</text>
  </g>

  <g>
    <rect x="290" y="200" width="130" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
    <text x="355" y="222" font-size="14" font-weight="600" fill="#501313" text-anchor="middle">reflection</text>
    <text x="355" y="240" font-size="12" fill="#A32D2D" text-anchor="middle">分析原因 / 给修正指令</text>
  </g>

  <circle cx="780" cy="228" r="13" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="780" y="233" font-size="12" fill="#173404" text-anchor="middle">END</text>

  <path d="M170 88 L210 88" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M340 88 L380 88" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M510 88 L550 88" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M615 116 L615 200" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#arrow)"/>

  <path d="M550 228 L420 228" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M355 200 L355 150 L580 150 L580 116" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M680 228 L762 228" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="485" y="220" font-size="12" fill="#A32D2D" text-anchor="middle">reflect</text>
  <text x="722" y="220" font-size="12" fill="#3B6D11" text-anchor="middle">pass</text>
  <text x="615" y="278" font-size="12" fill="#888780" text-anchor="middle">超过 3 轮 → force_end</text>

  <text x="700" y="120" font-size="12" fill="#888780">规则校验为纯函数，不调 LLM</text>
</g>
</svg>
